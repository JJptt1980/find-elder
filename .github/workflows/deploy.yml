name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每週一更新一次「好吃的」店家資料
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 整理台灣的店家資料（OpenStreetMap）
        run: |
          pip install osmium
          curl -sSfL -o taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
          python3 scripts/build-food.py taiwan.osm.pbf public/food
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
